name: Notify subscribers

# Fires a Web Push notification whenever the daily task publishes a fresh
# data.json (push to main). Runs on GitHub's network, so it is NOT subject to
# the Cowork sandbox's outbound allowlist — this is the reliable path.
# Manual runs are allowed via the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
    paths: ['data.json']
  workflow_dispatch:
    inputs:
      body:
        description: 'Notification body text'
        required: false
        default: 'A new macro report has been published.'

concurrency:
  group: notify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install push deps
        working-directory: push
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Derive notification title + body from data.json
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TITLE="New FX report"
            LABEL="${{ github.event.inputs.body }}"
          else
            # A post-release follow-up stamps meta.update; if it is fresh, say
            # "analysis updated" instead of repeating the whole daily headline.
            TITLE=$(node -e 'const m=require("./data.json").meta||{};const u=m.update;const f=u&&u.at&&(Date.now()-Date.parse(u.at))<45*60000;process.stdout.write(f?("📊 "+(u.title||"Analysis updated")):"New FX report")')
            LABEL=$(node -e 'const m=require("./data.json").meta||{};const u=m.update;const f=u&&u.at&&(Date.now()-Date.parse(u.at))<45*60000;process.stdout.write(f?(u.text||"Analysis updated after a release."):(m.reportLabel||"A new macro report has been published."))')
          fi
          {
            echo "title<<__EOF__"; echo "$TITLE"; echo "__EOF__"
            echo "label<<__EOF__"; echo "$LABEL"; echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Send Web Push
        working-directory: push
        env:
          VAPID_PUBLIC:  ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUBS_URL:      ${{ secrets.SUBS_URL }}
          ADMIN_KEY:     ${{ secrets.ADMIN_KEY }}
          # Passed through env, NOT interpolated into the command: report text
          # contains "$" (e.g. "WTI ~$84"), which bash expanded inside "..." and
          # silently mangled the notification ("$8" -> positional parameter).
          PUSH_TITLE: ${{ steps.meta.outputs.title }}
          PUSH_BODY:  ${{ steps.meta.outputs.label }}
        run: node send-push.js "$PUSH_TITLE" "$PUSH_BODY"
